<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Hub - Danuk</title>
    
    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            400: '#facc15', // Yellow 400
                            500: '#f59e0b', // Amber 500
                            600: '#d97706', // Amber 600
                            900: '#78350f', // Amber 900
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 4s linear infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020203;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
            /* Simple fallback background */
            background-image: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.1) 0%, transparent 50%);
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Background Canvas */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none; 
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: linear-gradient(145deg, rgba(15, 15, 18, 0.8), rgba(5, 5, 8, 0.95));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Dark Input */
        .input-dark {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f8fafc;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        .input-dark:hover, .input-dark:focus {
            border-color: #facc15;
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2), inset 0 2px 4px rgba(0,0,0,0.8);
            outline: none;
        }

        /* Cyber Button */
        .btn-cyber {
            background: linear-gradient(135deg, #d97706 0%, #facc15 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            color: #000;
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-cyber:hover {
            box-shadow: 0 6px 25px rgba(250, 204, 21, 0.6), inset 0 1px 0 rgba(255,255,255,0.6);
            transform: translateY(-2px);
        }
        .btn-cyber:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
        }
        .btn-cyber::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
        }
        .btn-cyber:hover::after { animation: shine 1s ease forwards; }
        @keyframes shine { 100% { left: 200%; } }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Typing cursor */
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Glitch Effect for Title */
        .glitch { position: relative; display: inline-block; }
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; pointer-events: none;
        }
        .glitch::before {
            left: 2px; text-shadow: -2px 0 #facc15; clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 4s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -2px 0 #ef4444, 2px 2px #f97316; clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 4s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0%, 95% { clip: rect(0,0,0,0); }
            96% { clip: rect(10px, 9999px, 31px, 0); transform: skew(0.5deg); }
            98% { clip: rect(24px, 9999px, 12px, 0); transform: skew(-0.5deg); }
            100% { clip: rect(0, 0, 0, 0); }
        }
        @keyframes glitch-anim2 {
            0%, 95% { clip: rect(0,0,0,0); }
            96% { clip: rect(65px, 9999px, 100px, 0); transform: translate(-2px, 2px); }
            98% { clip: rect(5px, 9999px, 40px, 0); transform: translate(2px, -2px); }
            100% { clip: rect(0, 0, 0, 0); }
        }

        /* Modals & Overlays */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 100; display: flex; justify-content: center; align-items: flex-start;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            padding-top: 5rem;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        /* Easter Egg Matrix */
        #matrix-overlay {
            position: fixed; inset: 0; background: #000; z-index: 99999;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #matrix-overlay.active { opacity: 1; pointer-events: auto; }
        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
    </style>
</head>

<body class="p-3 sm:p-4 md:p-8 flex justify-center items-start">
    
    <!-- Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="w-full max-w-4xl flex flex-col gap-6 md:gap-8 relative z-10 mx-auto pb-12">
        
        <!-- Top Navbar (Rectangular Glass) -->
        <nav class="glass-panel rounded-xl p-3 md:p-4 flex justify-between items-center z-20 sticky top-2 sm:top-4 opacity-0 animate-fade-up" style="animation-delay: 0ms;">
            <div class="flex items-center gap-3 font-bold text-lg text-white mx-1">
                <div class="w-10 h-10 rounded bg-cyber-500/20 border border-cyber-400/50 flex items-center justify-center text-cyber-400 shadow-[0_0_15px_rgba(245,158,11,0.3)]">
                    <i class="fas fa-layer-group"></i>
                </div>
                <span class="tracking-wide hidden sm:block">My<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyber-400 to-cyber-600 glitch" data-text="Hub">Hub</span></span>
            </div>
            
            <button onclick="toggleSearch()" class="flex-1 max-w-sm mx-3 md:mx-6 input-dark px-4 py-2.5 rounded flex items-center justify-between group">
                <div class="flex items-center gap-2 text-slate-400 group-hover:text-cyber-400 transition-colors">
                    <i class="fas fa-search text-sm"></i>
                    <span class="font-mono tracking-wide text-xs sm:text-sm">Search projects...</span>
                </div>
                <div class="hidden sm:flex gap-1">
                    <kbd class="bg-black/80 border border-cyber-500/30 rounded px-2 py-0.5 text-[10px] mono text-cyber-400">Ctrl+K</kbd>
                </div>
            </button>

            <button onclick="showShareModal()" class="w-10 h-10 rounded bg-black/50 border border-cyber-500/30 hover:border-cyber-400 hover:bg-cyber-500/20 text-slate-300 hover:text-cyber-400 transition-all flex items-center justify-center mx-1 active:scale-95" aria-label="Share">
                <i class="fas fa-share-nodes text-sm"></i>
            </button>
        </nav>

        <!-- Profile Section -->
        <div class="flex flex-col items-center text-center mt-2 relative z-10 opacity-0 animate-fade-up" style="animation-delay: 150ms;">
            
            <!-- Avatar (Interactive Easter Egg Trigger) -->
            <div class="relative mb-5 group cursor-pointer" id="avatar-trigger" title="Tap 5 times quickly!">
                <!-- Glowing rotating rings -->
                <div class="absolute inset-[-10px] border-2 border-dashed border-cyber-500/40 rounded-full animate-[spin_10s_linear_infinite] group-hover:border-cyber-400 group-hover:shadow-[0_0_20px_rgba(245,158,11,0.5)] transition-all"></div>
                
                <img id="profile-img" src="danuk.jpg" onerror="this.src='https://placehold.co/120x120/000/facc15?text=RW'" alt="Profile" class="relative w-28 h-28 md:w-32 md:h-32 rounded-full object-cover z-10 transition-transform duration-300 group-hover:scale-105 active:scale-95 bg-black border-2 border-cyber-500 shadow-[0_0_30px_rgba(245,158,11,0.4)] select-none">
            </div>
            
            <!-- Info with Glitch & Typing Effects -->
            <h1 id="profile-name" class="glitch text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2" data-text="Danuk Permadi">Danuk Permadi</h1>
            <p class="text-xs font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyber-400 to-orange-500 uppercase tracking-widest mb-4 drop-shadow-[0_0_5px_rgba(245,158,11,0.5)]">Developer & Creator</p>
            <p id="profile-bio" class="text-xs md:text-sm text-slate-400 leading-relaxed max-w-md mx-auto px-4 font-mono min-h-[40px]"></p>

            <!-- Social Media Icons (Exact copy request) -->
            <div class="flex justify-center gap-5 md:gap-7 mt-6 text-slate-500 text-xl md:text-2xl relative z-10">
                <a href="https://www.tiktok.com/@danukmobilador?_r=1&_t=ZS-9A3KVzabV5T" target="_blank" class="hover:text-white transition-transform transform hover:scale-125 hover:drop-shadow-[0_0_10px_rgba(255,255,255,0.5)] active:scale-90"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.instagram.com/danukpermadi2006?stkn=MTF3ZDV0NWI0MjZ5ZQ==" target="_blank" class="hover:text-pink-500 transition-transform transform hover:scale-125 hover:drop-shadow-[0_0_10px_rgba(236,72,153,0.5)] active:scale-90"><i class="fab fa-instagram"></i></a>
                <a href="https://youtube.com/@danukmobilador" target="_blank" class="hover:text-red-500 transition-transform transform hover:scale-125 hover:drop-shadow-[0_0_10px_rgba(239,68,68,0.5)] active:scale-90"><i class="fab fa-youtube"></i></a>
                <a href="https://github.com/danukpermadi2006" target="_blank" class="hover:text-cyber-400 transition-transform transform hover:scale-125 hover:drop-shadow-[0_0_10px_rgba(250,204,21,0.5)] active:scale-90"><i class="fab fa-github"></i></a>
                <a href="https://wa.me/6285129769015" target="_blank" class="hover:text-green-500 transition-transform transform hover:scale-125 hover:drop-shadow-[0_0_10px_rgba(34,197,94,0.5)] active:scale-90"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>

        <!-- Project Modules -->
        <main class="flex flex-col gap-4 mt-6 relative z-10 w-full">
            <div class="flex items-center gap-3 mb-2 px-1 opacity-0 animate-fade-up" style="animation-delay: 250ms;">
                <div class="w-3 h-3 rounded-sm bg-cyber-400 shadow-[0_0_12px_rgba(250,204,21,1)] animate-pulse"></div>
                <h2 class="text-xs md:text-sm font-extrabold text-white tracking-widest uppercase">Project Modules</h2>
                <div class="h-px flex-1 bg-gradient-to-r from-cyber-500/50 to-transparent"></div>
            </div>

            <!-- 
              Grid Layout Fix: 
              Using strict grid-cols-1 on mobile to ensure cards stack vertically with correct gap.
              This prevents the overlapping issue caused by absolute positioning.
            -->
            <div id="projects-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-5 w-full">
                <!-- Projects will be injected here via JS -->
            </div>
        </main>
        
        <!-- Clean Footer without year -->
        <footer class="py-6 mt-8 border-t border-cyber-500/20 text-center opacity-0 animate-fade-up" style="animation-delay: 600ms;">
             <p class="text-[10px] text-cyber-500/50 font-mono tracking-widest uppercase">System Online // v3.0</p>
        </footer>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="modal-overlay">
        <div class="transform scale-95 transition-all duration-300 relative w-[92%] max-w-2xl glass-panel rounded-xl overflow-hidden flex flex-col max-h-[70vh]" id="search-content">
            <!-- Top Neon Bar -->
            <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-yellow-300 via-cyber-500 to-orange-600"></div>
            
            <div class="flex items-center px-4 py-4 border-b border-cyber-500/20 gap-3 bg-black/60">
                <i class="fas fa-terminal text-cyber-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="Initiate search protocol..." class="flex-1 bg-transparent border-none outline-none text-sm md:text-base text-white placeholder-slate-600 mono" autocomplete="off">
                <kbd class="hidden sm:block bg-black/80 border border-cyber-500/30 rounded px-2 py-1 text-[10px] mono text-cyber-400">ESC</kbd>
            </div>
            <div id="search-results" class="overflow-y-auto p-2 flex-1 space-y-2 bg-black/40"></div>
            <div id="search-empty" class="hidden p-8 text-center text-slate-500">
                <i class="fas fa-satellite-dish text-3xl mb-3 opacity-30 text-cyber-500"></i>
                <p class="text-[10px] md:text-xs font-mono text-slate-400">No matching signals found.</p>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="modal-overlay">
        <div class="transform scale-95 transition-all duration-300 relative w-[90%] max-w-sm glass-panel rounded-xl p-6" id="share-content">
             <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-yellow-300 via-cyber-500 to-orange-600"></div>
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-sm font-bold text-white flex items-center gap-2 tracking-widest uppercase">
                    <i class="fas fa-network-wired text-cyber-400"></i> Share Hub
                </h3>
                <button onclick="closeShareModal()" class="w-8 h-8 flex items-center justify-center rounded bg-black/50 border border-cyber-500/30 hover:bg-cyber-500/20 text-slate-400 hover:text-cyber-400 transition active:scale-90"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex flex-col items-center gap-5">
                <div class="bg-white p-3 rounded-lg shadow-[0_0_30px_rgba(245,158,11,0.3)] border-4 border-black outline outline-2 outline-cyber-500" id="qrcode-container"></div>
                <div class="w-full relative flex gap-2">
                    <input type="text" id="share-url" readonly class="w-full input-dark rounded px-3 py-2 text-[10px] mono text-cyber-100">
                    <button onclick="copyShareUrl()" class="shrink-0 w-10 btn-cyber font-bold rounded flex items-center justify-center active:scale-95">
                        <i class="fas fa-copy text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Easter Egg Terminal -->
    <div id="matrix-overlay">
        <canvas id="matrix-canvas"></canvas>
        <div class="relative z-10 flex flex-col items-center gap-4 text-center p-6 bg-black/60 backdrop-blur-sm rounded-xl border border-cyber-500/30 shadow-[0_0_50px_rgba(245,158,11,0.2)]">
            <i class="fas fa-biohazard text-6xl md:text-8xl animate-pulse text-cyber-400 drop-shadow-[0_0_15px_#facc15]"></i>
            <h1 class="text-2xl md:text-4xl font-extrabold tracking-widest uppercase mono text-white">System Override</h1>
            <p class="text-sm md:text-base font-bold mono text-cyber-400">Admin Access Granted</p>
            <button onclick="closeEasterEgg()" class="mt-4 px-6 py-2 bg-cyber-500 hover:bg-cyber-400 text-black font-bold mono transition-colors rounded active:scale-95">RETURN TO HUB</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 bg-black/90 border border-cyber-500 px-5 py-3 rounded shadow-[0_0_20px_rgba(245,158,11,0.4)] transition-all duration-300 z-50 flex items-center gap-3 pointer-events-none">
        <i class="fas fa-check-circle text-cyber-400 text-lg shadow-cyber-400"></i>
        <span id="toast-msg" class="text-xs md:text-sm font-bold text-white mono">Success!</span>
    </div>

    <script>
        // Data Projects Sesuai Request
        const PROJECTS = [
            { 
                nama: "GitHub Manager", 
                url: "https://github-folder-uploader.vercel.app/", 
                icon: "fas fa-code-branch", 
                deskripsi: "Instant Upload, Edit & Manage Repositories directly from your browser. Full control panel.", 
                tag: "Tool" 
            },
            { 
                nama: "Vercel Deployer", 
                url: "https://vercel-directdeploy.vercel.app/", 
                icon: "fas fa-caret-up", 
                deskripsi: "Seamlessly deploy web applications to Vercel with automated build workflows.", 
                tag: "Hosting" 
            },
            { 
                nama: "Netlify Deployer", 
                url: "https://netlify-deployer-pearl.vercel.app/", 
                icon: "fas fa-server", 
                deskripsi: "Push and host your sites on Netlify instantly with zero configuration.", 
                tag: "Deploy" 
            },
            { 
                nama: "Danuk Downloader", 
                url: "https://tiktok-downloader-livid-two.vercel.app/", 
                icon: "fas fa-download", 
                deskripsi: "All-in-one TikTok tool: Download videos without watermark, music, profiles, and thumbnails.", 
                tag: "Utility" 
            },
            { 
                nama: "CVBuildPro", 
                url: "https://cv-builder-pro-one.vercel.app/", 
                icon: "fas fa-file-signature", 
                deskripsi: "Automated CV Maker. Generate modern, minimalist, and ATS-friendly resumes instantly.", 
                tag: "Generator" 
            }
        ];

        // Terminal Bio Effect
        const BIO_TEXT = "Welcome to my digital workspace. Tap my avatar 5 times for a surprise.";

        function initApp() {
            // Typing effect for Bio
            const bioEl = document.getElementById('profile-bio');
            let i = 0;
            function typeWriter() {
                if (i < BIO_TEXT.length) {
                    bioEl.innerHTML = BIO_TEXT.substring(0, i + 1) + '<span class="cursor-blink bg-cyber-400 text-black ml-1 px-[3px]">_</span>';
                    i++;
                    setTimeout(typeWriter, 35);
                } else {
                    bioEl.innerHTML = BIO_TEXT + '<span class="cursor-blink text-cyber-400 ml-1">_</span>';
                }
            }
            setTimeout(typeWriter, 800);

            renderProjects();
            initParticles();
        }

        function renderProjects() {
            const container = document.getElementById('projects-container');
            let html = '';
            
            PROJECTS.forEach((item, index) => {
                // Determine layout span: first item full width on md (optional, keeping it standard grid for stability)
                const isFeatured = index === 0;
                const colSpanClass = isFeatured ? 'md:col-span-2' : '';
                const delay = 300 + (index * 100); // Staggered entrance animation delay

                /* 
                   THE FIX:
                   - outer div uses standard styling.
                   - card-inner uses `relative h-full` so it stretches the outer div properly.
                   - No more `absolute inset` on the content wrapper.
                */
                html += `
                    <div class="${colSpanClass} opacity-0 translate-y-10" style="animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${delay}ms forwards;">
                        
                        <!-- Transform GPU wrapping for 3D effect -->
                        <div class="cyber-card relative group rounded-xl p-[1px] h-full flex flex-col transform-gpu transition-transform duration-200" onpointerdown="this.style.transform='scale(0.98)'" onpointerup="this.style.transform='scale(1)'">
                            
                            <!-- Neon Rotating Border Background -->
                            <div class="absolute inset-0 rounded-xl overflow-hidden pointer-events-none opacity-40 group-hover:opacity-100 transition-opacity duration-300">
                                <div class="absolute w-[200%] h-[200%] top-[-50%] left-[-50%] bg-[conic-gradient(from_0deg,transparent_0%,transparent_70%,#facc15_100%)] animate-spin-slow"></div>
                            </div>
                            
                            <!-- Main Solid Content (Relative, defines height!) -->
                            <div class="card-inner relative z-10 bg-[#07070a] rounded-[11px] p-4 md:p-5 flex flex-col h-full group-hover:bg-[#0a0a0f] transition-colors border border-white/5">
                                
                                <div class="flex items-start gap-4 mb-3 md:mb-4">
                                    <!-- Icon Box -->
                                    <div class="w-12 h-12 shrink-0 rounded bg-black border border-cyber-500/20 text-cyber-500/70 flex justify-center items-center text-xl transition-all duration-300 group-hover:bg-cyber-400 group-hover:text-black group-hover:border-cyber-400 group-hover:shadow-[0_0_15px_#facc15]">
                                        <i class="${item.icon}"></i>
                                    </div>
                                    
                                    <!-- Title & Tag -->
                                    <div class="flex-1 min-w-0 pt-1">
                                        <h3 class="text-white font-extrabold text-sm md:text-base tracking-wide truncate group-hover:text-cyber-400 transition-colors">${item.nama}</h3>
                                        <span class="inline-block mt-0.5 text-[9px] uppercase font-bold tracking-widest bg-black border border-cyber-500/30 text-cyber-400 px-1.5 py-[2px] rounded shadow-sm">${item.tag}</span>
                                    </div>
                                </div>
                                
                                <!-- Description -->
                                <p class="text-slate-400 text-[10px] md:text-xs leading-relaxed font-mono flex-1 mb-4 group-hover:text-slate-300 line-clamp-3">${item.deskripsi}</p>
                                
                                <!-- Action Button -->
                                <div class="mt-auto">
                                    <a href="${item.url}" target="_blank" class="w-full py-2.5 md:py-3 btn-cyber font-extrabold rounded text-[10px] md:text-xs transition-all flex items-center justify-center gap-2 group/btn">
                                        LAUNCH SYSTEM <i class="fas fa-rocket opacity-80 group-hover/btn:-translate-y-1 group-hover/btn:translate-x-1 transition-transform"></i>
                                    </a>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            setTimeout(initTiltEffect, 500); // Initialize tilt after render & animation
        }

        // 3D Tilt Effect on hover
        function initTiltEffect() {
            const cards = document.querySelectorAll('.cyber-card');
            cards.forEach(card => {
                const inner = card.querySelector('.card-inner');
                
                card.addEventListener('pointermove', e => {
                    // Disable tilt on small mobile devices to prevent weird scrolling interference
                    if(window.innerWidth < 768) return; 
                    
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -8; 
                    const rotateY = ((x - centerX) / centerX) * 8;
                    
                    inner.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                });
                
                card.addEventListener('pointerleave', () => {
                    inner.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                });
            });
        }

        // --- Utilities & Search ---
        let isSearchOpen = false;
        const searchModal = document.getElementById('search-modal');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const searchContent = document.getElementById('search-content');

        function toggleSearch() {
            isSearchOpen = !isSearchOpen;
            if (isSearchOpen) {
                searchModal.classList.add('active');
                setTimeout(() => { searchContent.classList.replace('scale-95', 'scale-100'); searchInput.focus(); }, 10);
                renderSearchResults('');
            } else {
                searchContent.classList.replace('scale-100', 'scale-95');
                setTimeout(() => { searchModal.classList.remove('active'); searchInput.value = ''; }, 300);
            }
        }

        searchModal.addEventListener('mousedown', (e) => { if(e.target === searchModal) toggleSearch(); });

        searchInput.addEventListener('input', (e) => {
            renderSearchResults(e.target.value);
        });

        function renderSearchResults(query) {
            query = query.toLowerCase().trim();
            searchResults.innerHTML = '';
            const emptyEl = document.getElementById('search-empty');
            
            if (query === '') {
                emptyEl.classList.remove('hidden');
                emptyEl.innerHTML = `<div class="p-6 text-center text-[10px] md:text-xs text-slate-500 mono">Awaiting input...</div>`;
                return;
            }

            const results = PROJECTS.filter(item => 
                item.nama.toLowerCase().includes(query) || 
                item.deskripsi.toLowerCase().includes(query) ||
                item.tag.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                emptyEl.classList.remove('hidden');
                emptyEl.innerHTML = `
                    <div class="p-8 text-center text-slate-500">
                        <i class="fas fa-satellite-dish text-2xl md:text-3xl mb-3 opacity-30"></i>
                        <p class="text-[10px] md:text-xs font-mono text-slate-400">No signals match "<span class="text-cyber-400">${query}</span>"</p>
                    </div>`;
            } else {
                emptyEl.classList.add('hidden');
                let html = '';
                results.forEach(item => {
                    const regex = new RegExp(`(${query})`, 'gi');
                    const highlightedName = item.nama.replace(regex, '<span class="text-black font-bold bg-cyber-400 px-0.5 rounded">$1</span>');
                    
                    html += `
                        <a href="${item.url}" target="_blank" onclick="toggleSearch()" class="flex items-center gap-3 p-3 rounded bg-black/40 border border-transparent hover:border-cyber-500/50 hover:bg-cyber-900/20 transition-all group active:scale-[0.98]">
                            <div class="w-10 h-10 rounded border border-cyber-500/20 flex items-center justify-center text-slate-500 bg-black group-hover:bg-cyber-500 group-hover:text-black transition-all">
                                <i class="${item.icon} text-sm"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-xs md:text-sm font-bold text-slate-200 truncate group-hover:text-cyber-400">${highlightedName}</h4>
                                <p class="text-[9px] md:text-[10px] text-slate-500 truncate mono mt-0.5 group-hover:text-slate-300">${item.tag}</p>
                            </div>
                            <i class="fas fa-external-link-alt text-cyber-500/30 group-hover:text-cyber-400 transition-colors text-[10px]"></i>
                        </a>
                    `;
                });
                searchResults.innerHTML = html;
            }
        }

        // --- Share & Toast ---
        let qrCodeInstance = null;
        function showShareModal() {
            const currentUrl = window.location.href.split('#')[0].split('?')[0]; 
            document.getElementById('share-url').value = currentUrl;
            
            const modal = document.getElementById('share-modal');
            const content = document.getElementById('share-content');
            modal.classList.add('active');
            setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);

            if (!qrCodeInstance) {
                document.getElementById('qrcode-container').innerHTML = '';
                qrCodeInstance = new QRCode(document.getElementById("qrcode-container"), {
                    text: currentUrl, width: 140, height: 140, colorDark : "#000000", colorLight : "#ffffff"
                });
            }
        }

        function closeShareModal() { 
            document.getElementById('share-content').classList.replace('scale-100', 'scale-95');
            setTimeout(() => document.getElementById('share-modal').classList.remove('active'), 300);
        }
        document.getElementById('share-modal').addEventListener('mousedown', (e) => { if(e.target.id === 'share-modal') closeShareModal(); });

        function copyShareUrl() {
            const text = document.getElementById('share-url').value;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast('Network link copied!'));
            } else {
                const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
                showToast('Network link copied!');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); toggleSearch(); }
            if (e.key === 'Escape') { if (isSearchOpen) toggleSearch(); closeShareModal(); closeEasterEgg(); }
        });

        // --- Background Particles ---
        function initParticles() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            let mouse = { x: -1000, y: -1000 };
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive: true});

            class Particle {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4;
                    this.size = Math.random() * 1.5 + 0.5;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                    
                    // Simple interaction
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx*dx + dy*dy);
                    if (distance < 120) { this.x -= dx * 0.01; this.y -= dy * 0.01; }
                }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(245, 158, 11, 0.4)'; ctx.fill();
                }
            }

            // Optimize count for mobile
            const count = width > 768 ? 50 : 25;
            for (let i = 0; i < count; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                    for (let j = i + 1; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 100) {
                            ctx.beginPath(); ctx.strokeStyle = `rgba(245, 158, 11, ${0.15 - dist/666})`;
                            ctx.lineWidth = 0.5; ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // --- Easter Egg (Avatar Multi-Tap) ---
        let avatarClicks = 0;
        let clickTimer;
        let matrixInterval;

        document.getElementById('avatar-trigger').addEventListener('click', (e) => {
            avatarClicks++;
            clearTimeout(clickTimer);
            
            // Add a little physical feedback pulse
            const img = document.getElementById('profile-img');
            img.style.transform = 'scale(0.9)';
            setTimeout(() => img.style.transform = '', 100);

            if (avatarClicks >= 5) {
                avatarClicks = 0;
                document.getElementById('matrix-overlay').classList.add('active');
                initMatrixRain();
            } else {
                clickTimer = setTimeout(() => { avatarClicks = 0; }, 600); // Reset after 600ms of inactivity
            }
        });

        function closeEasterEgg() {
            document.getElementById('matrix-overlay').classList.remove('active');
            clearInterval(matrixInterval);
        }

        function initMatrixRain() {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;
            
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*<>?'.split('');
            const fontSize = window.innerWidth < 768 ? 12 : 16;
            const columns = w / fontSize;
            const drops = [];
            for(let x = 0; x < columns; x++) drops[x] = 1; 

            window.addEventListener('resize', () => {
                if(document.getElementById('matrix-overlay').classList.contains('active')){
                    w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;
                }
            });

            clearInterval(matrixInterval);
            matrixInterval = setInterval(() => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Fade trail
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#facc15'; // Amber
                ctx.font = fontSize + 'px "JetBrains Mono", monospace';
                
                for(let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if(drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }, 35);
        }

        // Start everything
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

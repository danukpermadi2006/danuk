    <style>
        /* =======================================================
           TEMA AMBER/YELLOW CYBER GLASS
           ======================================================= */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #050505; /* Hitam pekat */
            background-image: 
                radial-gradient(circle at 15% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 25%),
                radial-gradient(circle at 85% 100%, rgba(250, 204, 21, 0.12) 0%, transparent 25%);
            background-attachment: fixed;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-panel {
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.8), rgba(10, 10, 10, 0.9));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-4px);
            border-color: rgba(245, 158, 11, 0.4); /* Amber border on hover */
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.8), 0 0 15px -3px rgba(245, 158, 11, 0.2);
            background: linear-gradient(145deg, rgba(30, 25, 15, 0.9), rgba(15, 15, 15, 0.95));
        }

        .input-dark {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.5);
            color: #f8fafc;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .input-dark:hover, .input-dark:focus {
            border-color: #f59e0b;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .input-dark:focus {
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2), inset 0 2px 4px rgba(0,0,0,0.5);
            outline: none;
        }

        /* Buttons & Animations */
        .btn-action {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-action::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
        }
        .btn-action:hover:not(:disabled)::after { animation: shine 1.5s infinite; }
        
        /* Tema Tombol Kuning/Amber */
        .btn-upload { 
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); 
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3), inset 0 1px 0 rgba(255,255,255,0.2); 
            text-shadow: 0 1px 2px rgba(0,0,0,0.3); 
        }
        .btn-upload:hover { 
            box-shadow: 0 6px 30px rgba(245, 158, 11, 0.5); 
            transform: translateY(-2px); 
        }

        @keyframes shine { 100% { left: 200%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        /* Modal Overlay */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 100; display: flex; justify-content: center; align-items: flex-start;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            padding-top: 5rem;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            transform: scale(0.95) translateY(-20px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; border: 1px solid #000; }
        ::-webkit-scrollbar-thumb:hover { background-color: #f59e0b; }

        .text-gradient {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
    </style>
</head>

    <script>
        const DOM = {
            profileImg: document.getElementById('profile-img'),
            profileName: document.getElementById('profile-name'),
            profileTagline: document.getElementById('profile-tagline'),
            profileBio: document.getElementById('profile-bio'),
            profileLocation: document.getElementById('profile-location'),
            socialContainer: document.getElementById('social-container'),
            
            clockTime: document.getElementById('clock-time'),
            clockDate: document.getElementById('clock-date'),
            greetingText: document.getElementById('greeting-text'),
            
            quoteContainer: document.getElementById('quote-container'),
            quoteText: document.getElementById('quote-text'),
            
            projectsContainer: document.getElementById('projects-container'),
            
            searchModal: document.getElementById('search-modal'),
            searchInput: document.getElementById('search-input'),
            searchResults: document.getElementById('search-results'),
            searchEmpty: document.getElementById('search-empty'),
            
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toast-msg'),
            shareModal: document.getElementById('share-modal'),
            shareUrl: document.getElementById('share-url')
        };

        let qrCodeInstance = null;
        let isSearchOpen = false;

        function initApp() {
            // Render Profile
            DOM.profileImg.src = DATA.profil.foto;
            DOM.profileName.textContent = DATA.profil.nama;
            DOM.profileTagline.textContent = DATA.profil.tagline;
            DOM.profileBio.textContent = DATA.profil.bio;
            DOM.profileLocation.textContent = DATA.profil.lokasi;

            // Render Socials (Updated colors to match yellow theme hover state)
            DOM.socialContainer.innerHTML = DATA.sosialMedia.map(soc => `
                <a href="${soc.url}" target="_blank" class="w-10 h-10 rounded-xl bg-black/40 border border-slate-700 hover:border-amber-500 hover:bg-amber-500/20 text-slate-400 hover:text-white flex items-center justify-center transition-all shadow-sm" title="${soc.nama}">
                    <i class="${soc.icon} text-base"></i>
                </a>
            `).join('');

            // Render Quotes
            if (DATA.pengaturan.showQuotes && DATA.quotes.length > 0) {
                const randomQuote = DATA.quotes[Math.floor(Math.random() * DATA.quotes.length)];
                DOM.quoteText.textContent = `"${randomQuote}"`;
            } else {
                DOM.quoteContainer.style.display = 'none';
            }

            renderProjects();
            
            // Start Clock
            updateClock();
            setInterval(updateClock, 1000);
            
            setupPWA();
        }

        function renderProjects() {
            let html = '';
            
            // Render Exactly 4 Items
            const itemsToRender = DATA.projects.slice(0, 4);

            itemsToRender.forEach(item => {
                html += `
                    <div class="glass-panel glass-card-hover rounded-2xl p-5 flex flex-col justify-between h-full relative group">
                        <div class="flex flex-col sm:flex-row sm:items-start gap-4 mb-5 relative z-10">
                            <!-- Icon Box -->
                            <div class="w-12 h-12 rounded-xl bg-black/50 border border-slate-700 flex items-center justify-center text-amber-400 text-xl shadow-inner group-hover:bg-amber-500 group-hover:text-white group-hover:border-amber-400 transition-all duration-300 flex-shrink-0">
                                <i class="${item.icon}"></i>
                            </div>
                            <!-- Details -->
                            <div class="flex-1 min-w-0 mt-2 sm:mt-0">
                                <div class="flex flex-wrap items-center gap-2 mb-1.5">
                                    <h3 class="font-bold text-white text-base truncate" title="${item.nama}">${item.nama}</h3>
                                    ${item.tag ? `<span class="text-[9px] uppercase font-bold tracking-wider bg-yellow-500/20 border border-yellow-500/30 text-yellow-400 px-1.5 py-0.5 rounded">${item.tag}</span>` : ''}
                                </div>
                                <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed mono">${item.deskripsi}</p>
                            </div>
                        </div>
                        
                        <!-- Actions -->
                        <div class="flex gap-2 mt-auto relative z-10">
                            <a href="${item.url}" target="_blank" class="flex-1 bg-black/40 border border-slate-700 hover:border-amber-500 hover:bg-amber-500/20 text-white text-center py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                                Launch <i class="fas fa-external-link-alt text-[10px]"></i>
                            </a>
                            <button onclick="copyToClipboard('${item.url}', 'Project link copied!')" class="px-4 bg-black/40 border border-slate-700 hover:bg-slate-800 rounded-xl transition-colors text-slate-400 hover:text-white focus:outline-none" title="Copy Link">
                                <i class="fas fa-link text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            DOM.projectsContainer.innerHTML = html;
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            DOM.clockTime.textContent = `${hours}:${minutes}`;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            DOM.clockDate.textContent = now.toLocaleDateString('id-ID', options);

            let greeting = 'Selamat Malam';
            const h = now.getHours();
            if (h >= 4 && h < 11) greeting = 'Selamat Pagi';
            else if (h >= 11 && h < 15) greeting = 'Selamat Siang';
            else if (h >= 15 && h < 18) greeting = 'Selamat Sore';
            
            const firstName = DATA.profil.nama.split(' ')[0];
            const fullGreeting = `${greeting}, ${firstName}!`;
            if (DOM.greetingText.textContent !== fullGreeting) {
                DOM.greetingText.textContent = fullGreeting;
            }
        }

        function toggleSearch() {
            isSearchOpen = !isSearchOpen;
            if (isSearchOpen) {
                DOM.searchModal.classList.add('active');
                setTimeout(() => DOM.searchInput.focus(), 50);
                renderSearchResults('');
            } else {
                DOM.searchModal.classList.remove('active');
                DOM.searchInput.value = '';
            }
        }

        DOM.searchModal.addEventListener('click', (e) => {
            if(e.target === DOM.searchModal) toggleSearch();
        });
        DOM.shareModal.addEventListener('click', (e) => {
            if(e.target === DOM.shareModal) closeShareModal();
        });

        let searchTimeout;
        DOM.searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => renderSearchResults(e.target.value), 200);
        });

        function renderSearchResults(query) {
            query = query.toLowerCase().trim();
            DOM.searchResults.innerHTML = '';
            
            if (query === '') {
                DOM.searchEmpty.classList.remove('hidden');
                DOM.searchEmpty.innerHTML = `<div class="p-4 text-center text-xs text-slate-500 mono">Type to search projects...</div>`;
                return;
            }

            const results = DATA.projects.filter(item => 
                item.nama.toLowerCase().includes(query) || 
                (item.deskripsi && item.deskripsi.toLowerCase().includes(query)) ||
                (item.tag && item.tag.toLowerCase().includes(query))
            );

            if (results.length === 0) {
                DOM.searchEmpty.classList.remove('hidden');
                DOM.searchEmpty.innerHTML = `
                    <div class="p-8 text-center text-slate-500">
                        <i class="fas fa-ghost text-3xl mb-3 opacity-50"></i>
                        <p class="text-xs font-mono text-slate-400">No matches for "<span class="text-amber-400">${query}</span>"</p>
                    </div>`;
            } else {
                DOM.searchEmpty.classList.add('hidden');
                let html = '';
                results.forEach(item => {
                    html += `
                        <a href="${item.url}" target="_blank" onclick="toggleSearch()" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/[0.05] transition-colors group">
                            <div class="w-10 h-10 rounded-xl bg-black/50 border border-slate-700 flex items-center justify-center text-amber-400 group-hover:bg-amber-500 group-hover:text-white group-hover:border-amber-400 transition-colors">
                                <i class="${item.icon} text-sm"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-sm font-bold text-slate-200 truncate group-hover:text-amber-400">${highlightText(item.nama, query)}</h4>
                                <p class="text-[10px] text-slate-500 truncate mono">${item.tag || 'Project'}</p>
                            </div>
                            <i class="fas fa-external-link-alt text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity text-xs"></i>
                        </a>
                    `;
                });
                DOM.searchResults.innerHTML = html;
            }
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="bg-amber-500/30 text-yellow-300">$1</span>');
        }

        function copyEmail() { copyToClipboard(DATA.profil.email, 'Email address copied!'); }

        function copyToClipboard(text, successMsg) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast(successMsg));
            } else {
                const ta = document.createElement("textarea");
                ta.value = text; ta.style.position = "fixed"; ta.style.left = "-999999px";
                document.body.appendChild(ta); ta.focus(); ta.select();
                try { document.execCommand('copy'); showToast(successMsg); } 
                catch (err) { showToast('Copy failed'); }
                ta.remove();
            }
        }

        function showToast(message) {
            DOM.toastMsg.textContent = message;
            DOM.toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => DOM.toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function showShareModal() {
            const currentUrl = window.location.href.split('#')[0].split('?')[0]; 
            DOM.shareUrl.value = currentUrl;
            DOM.shareModal.classList.add('active');

            if (!qrCodeInstance) {
                document.getElementById('qrcode-container').innerHTML = '';
                qrCodeInstance = new QRCode(document.getElementById("qrcode-container"), {
                    text: currentUrl, width: 150, height: 150,
                    colorDark : "#000000", colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } else {
                qrCodeInstance.clear();
                qrCodeInstance.makeCode(currentUrl);
            }
        }

        function closeShareModal() { DOM.shareModal.classList.remove('active'); }
        function copyShareUrl() { copyToClipboard(DOM.shareUrl.value, 'Hub Link copied!'); }

        function setupPWA() {
            const manifest = {
                name: DATA.profil.nama,
                short_name: "Hub",
                display: "standalone",
                background_color: "#050505",
                theme_color: "#f59e0b",
                icons: [{ src: DATA.profil.foto, sizes: "192x192 512x512", type: "image/png", purpose: "any maskable" }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(blob));
        }

        window.addEventListener('keydown', (e) => {
            // Search: "/" atau "Ctrl+K"
            if (e.key === '/' && document.activeElement !== DOM.searchInput && !isSearchOpen) {
                e.preventDefault(); toggleSearch();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault(); toggleSearch();
            }
            // Esc
            if (e.key === 'Escape') {
                if (isSearchOpen) toggleSearch();
                closeShareModal();
            }
        });

        // Init App
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

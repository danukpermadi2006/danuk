    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020203;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Cyber Grid Background 3D */
        .cyber-grid-container {
            position: fixed; inset: 0; z-index: -2;
            perspective: 1000px; overflow: hidden; pointer-events: none;
        }
        .cyber-grid {
            position: absolute; width: 200vw; height: 200vh;
            left: -50vw; top: -50vh;
            background-image: 
                linear-gradient(rgba(245, 158, 11, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 158, 11, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateY(100px) translateZ(-200px);
            animation: gridMove 5s linear infinite;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 5%, rgba(0,0,0,0) 60%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 5%, rgba(0,0,0,0) 60%);
        }
        @keyframes gridMove {
            0% { transform: rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        /* Glitch Effect */
        .glitch { position: relative; display: inline-block; }
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; pointer-events: none;
        }
        .glitch::before {
            left: 2px; text-shadow: -2px 0 #facc15; clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 4s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -2px 0 #ef4444, 2px 2px #f97316; clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 4s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0%, 95% { clip: rect(0,0,0,0); }
            96% { clip: rect(10px, 9999px, 31px, 0); transform: skew(0.5deg); }
            98% { clip: rect(24px, 9999px, 12px, 0); transform: skew(-0.5deg); }
            100% { clip: rect(0, 0, 0, 0); }
        }
        @keyframes glitch-anim2 {
            0%, 95% { clip: rect(0,0,0,0); }
            96% { clip: rect(65px, 9999px, 100px, 0); transform: translate(-2px, 2px); }
            98% { clip: rect(5px, 9999px, 40px, 0); transform: translate(2px, -2px); }
            100% { clip: rect(0, 0, 0, 0); }
        }

        /* Blinking Terminal Cursor */
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 3D Perspective Class */
        .perspective-1000 { perspective: 1000px; transform-style: preserve-3d; }

        /* Canvas Background */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: auto; 
        }
        
        .glass-panel {
            background: linear-gradient(145deg, rgba(15, 15, 18, 0.8), rgba(5, 5, 8, 0.95));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05),
                        0 0 20px -5px rgba(245, 158, 11, 0.05);
            position: relative;
        }

        .cyber-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center;
        }
        
        .cyber-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(245, 158, 11, 0.6);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.9), 
                        0 0 25px rgba(245, 158, 11, 0.3),
                        inset 0 0 15px rgba(245, 158, 11, 0.1);
            background: linear-gradient(145deg, rgba(30, 25, 15, 0.9), rgba(10, 10, 12, 0.95));
            z-index: 10;
        }

        .cyber-card:hover .icon-glow {
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.8);
            transform: scale(1.1);
            color: #fff;
            background: #f59e0b;
            border-color: #facc15;
        }

        .input-dark {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f8fafc;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            font-size: 14px !important; 
        }
        
        .input-dark:hover, .input-dark:focus {
            border-color: #facc15;
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3), inset 0 2px 4px rgba(0,0,0,0.8);
            outline: none;
        }

        .btn-cyber {
            background: linear-gradient(135deg, #d97706 0%, #facc15 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            color: #000;
            text-shadow: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-cyber:hover {
            box-shadow: 0 6px 25px rgba(250, 204, 21, 0.6), inset 0 1px 0 rgba(255,255,255,0.6);
            transform: translateY(-2px);
        }
        .btn-cyber::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
        }
        .btn-cyber:hover::after { animation: shine 1s ease forwards; }

        @keyframes shine { 100% { left: 200%; } }
        
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        .scanline-effect {
            position: fixed; inset: 0; pointer-events: none; z-index: 9999;
            background: linear-gradient(to bottom, transparent 50%, rgba(245, 158, 11, 0.03) 51%);
            background-size: 100% 4px;
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 100; display: flex; justify-content: center; align-items: flex-start;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            padding-top: 5rem;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            transform: scale(0.9) translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.2);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

        /* Easter Egg Terminal */
        #matrix-overlay {
            position: fixed; inset: 0; background: #000; z-index: 99999;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #matrix-overlay.active { opacity: 1; pointer-events: auto; }
        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .system-msg { position: relative; z-index: 2; text-align: center; color: #facc15; text-shadow: 0 0 10px #f59e0b; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
    </style>
</head>

        function initApp() {
            // Render Profile
            DOM.profileImg.src = DATA.profil.foto;

            DOM.profileName.setAttribute('data-text', DATA.profil.nama); // Set attribute for Glitch
            DOM.profileTagline.textContent = DATA.profil.tagline;
            
            // Terminal Typing Effect for Bio
            DOM.profileBio.innerHTML = '';
            let bioText = DATA.profil.bio;
            let i = 0;
            function typeWriter() {
                if (i < bioText.length) {
                    DOM.profileBio.innerHTML = bioText.substring(0, i + 1) + '<span class="cursor-blink bg-cyber-400 text-black ml-1 px-[3px] shadow-[0_0_8px_#facc15]">_</span>';
                    i++;
                    setTimeout(typeWriter, 40); // Kecepatan mengetik
                } else {
                    DOM.profileBio.innerHTML = bioText + '<span class="cursor-blink text-cyber-400 ml-1 shadow-[0_0_8px_#facc15]">_</span>';
                }
            }
            setTimeout(typeWriter, 600); // Delay sebelum mengetik mulai

            // Render Exact Copied Socials
            DOM.socialContainer.innerHTML = DATA.sosialMedia.map(soc => {
                let hoverColor = "hover:text-cyber-400"; // Default
                if (soc.icon.includes('instagram')) hoverColor = "hover:text-pink-500";
                else if (soc.icon.includes('youtube')) hoverColor = "hover:text-red-500";
                else if (soc.icon.includes('whatsapp')) hoverColor = "hover:text-green-500";
                else if (soc.icon.includes('tiktok')) hoverColor = "hover:text-white";
                
                return `
                <a href="${soc.url}" target="_blank" class="${hoverColor} transition-all transform hover:scale-125 hover:drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                    <i class="${soc.icon}"></i>
                </a>
                `;
            }).join('');

            renderProjects();
            initParticles(); // Start the background canvas animation
        }

        function renderProjects() {
            let html = '';
            
            DATA.projects.forEach((item, index) => {
                // First item spans full width on tablet/desktop
                const isFeatured = index === 0;
                const colSpanClass = isFeatured ? 'md:col-span-2' : '';
                const layoutClasses = isFeatured 
                    ? 'flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6' 
                    : 'flex flex-col gap-4 h-full';
                const iconSize = isFeatured ? 'w-14 h-14 sm:w-16 sm:h-16 text-2xl sm:text-3xl' : 'w-12 h-12 text-xl';
                
                html += `
                    <div class="cyber-card rounded-xl relative group perspective-1000 ${colSpanClass} bg-[#020203]">
                        
                        <!-- Animated Rotating Neon Border -->
                        <div class="absolute inset-0 rounded-xl overflow-hidden pointer-events-none z-0 border border-white/5">
                            <div class="absolute top-[-50%] left-[-50%] w-[200%] h-[200%] animate-[spin_4s_linear_infinite] bg-[conic-gradient(from_0deg,transparent_0%,transparent_75%,#facc15_100%)] opacity-30 group-hover:opacity-100 group-hover:animate-[spin_1.5s_linear_infinite] transition-opacity duration-300"></div>
                        </div>
                        
                        <!-- 3D Tilting Content Wrapper -->
                        <div class="card-content-wrap absolute inset-[1.5px] md:inset-[2px] bg-gradient-to-br from-[#0a0a0c] to-[#050508] rounded-[10px] p-4 md:p-5 z-10 transition-transform duration-100 ease-out flex flex-col group-hover:shadow-[0_0_40px_rgba(245,158,11,0.15)] group-hover:bg-[#07070a]">
                            
                            <div class="${layoutClasses} relative z-20 pt-1 h-full">
                                
                                <!-- Glowing Icon Box -->
                                <div class="icon-glow ${iconSize} rounded border border-cyber-500/30 flex items-center justify-center text-cyber-400 bg-black/80 transition-all duration-300 flex-shrink-0 relative overflow-hidden group-hover:scale-110 group-hover:shadow-[0_0_25px_rgba(250,204,21,0.6)] group-hover:bg-cyber-400 group-hover:text-black group-hover:border-cyber-400">
                                    <i class="${item.icon} relative z-10"></i>
                                </div>
                                
                                <!-- Details -->
                                <div class="flex-1 min-w-0">
                                    <div class="flex flex-wrap items-center gap-2 mb-1">
                                        <h3 class="font-extrabold text-white text-sm md:text-base tracking-wide group-hover:text-cyber-400 transition-colors truncate drop-shadow-[0_0_5px_rgba(255,255,255,0.2)]">${item.nama}</h3>
                                        <span class="text-[9px] uppercase font-bold tracking-widest bg-cyber-900/40 border border-cyber-500/30 text-cyber-400 px-1.5 py-0.5 rounded shadow-[0_0_10px_rgba(245,158,11,0.1)] group-hover:bg-cyber-500/20">${item.tag}</span>
                                    </div>
                                    <p class="text-[10px] md:text-xs text-slate-400 leading-relaxed font-mono ${isFeatured ? 'max-w-xl' : 'line-clamp-2'} group-hover:text-slate-300 transition-colors">${item.deskripsi}</p>
                                </div>

                                <!-- Actions -->
                                <div class="flex gap-2 ${isFeatured ? 'sm:ml-auto mt-3 sm:mt-0' : 'mt-auto pt-4'} relative z-30">
                                    <button onclick="copyToClipboard('${item.url}', 'Link copied to clipboard!')" class="w-10 h-10 md:w-11 md:h-11 bg-black/80 border border-cyber-500/40 hover:border-cyber-400 rounded transition-all text-slate-400 hover:text-cyber-400 hover:shadow-[0_0_15px_rgba(245,158,11,0.4)] flex items-center justify-center focus:outline-none hover:scale-105 active:scale-95" title="Copy Link">
                                        <i class="fas fa-link text-xs md:text-sm"></i>
                                    </button>
                                    <a href="${item.url}" target="_blank" class="${isFeatured ? 'px-6 sm:px-8' : 'flex-1'} h-10 md:h-11 btn-cyber font-extrabold rounded text-[10px] md:text-xs transition-all flex items-center justify-center gap-2 group/btn hover:scale-105 active:scale-95 shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.5)]">
                                        LAUNCH SYSTEM <i class="fas fa-rocket opacity-80 group-hover/btn:-translate-y-1 group-hover/btn:translate-x-1 transition-transform text-[10px]"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            DOM.projectsContainer.innerHTML = html;
            
            // Inisialisasi efek 3D Tilt setelah dirender
            setTimeout(initTiltEffect, 100);
        }

        // --- 3D Hover Tilt Logic ---
        function initTiltEffect() {
            const cards = document.querySelectorAll('.cyber-card');
            cards.forEach(card => {
                const inner = card.querySelector('.card-content-wrap');
                
                // Gunakan pointermove untuk support sentuhan jari & mouse
                card.addEventListener('pointermove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    // Hitung rotasi (maksimal kemiringan 10 derajat)
                    const rotateX = ((y - centerY) / centerY) * -10; 
                    const rotateY = ((x - centerX) / centerX) * 10;
                    
                    inner.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                });
                
                card.addEventListener('pointerleave', () => {
                    inner.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                });
            });
        }

        function toggleSearch() {
            isSearchOpen = !isSearchOpen;
            if (isSearchOpen) {
                DOM.searchModal.classList.add('active');
                setTimeout(() => DOM.searchInput.focus(), 50);
                renderSearchResults('');
            } else {
                DOM.searchModal.classList.remove('active');
                DOM.searchInput.value = '';
            }
        }

        DOM.searchModal.addEventListener('click', (e) => { if(e.target === DOM.searchModal) toggleSearch(); });
        DOM.shareModal.addEventListener('click', (e) => { if(e.target === DOM.shareModal) closeShareModal(); });

        let searchTimeout;
        DOM.searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => renderSearchResults(e.target.value), 200);
        });

        function renderSearchResults(query) {
            query = query.toLowerCase().trim();
            DOM.searchResults.innerHTML = '';
            
            if (query === '') {
                DOM.searchEmpty.classList.remove('hidden');
                DOM.searchEmpty.innerHTML = `<div class="p-6 text-center text-[10px] md:text-xs text-slate-500 mono">Awaiting input...</div>`;
                return;
            }

            const results = DATA.projects.filter(item => 
                item.nama.toLowerCase().includes(query) || 
                (item.deskripsi && item.deskripsi.toLowerCase().includes(query)) ||
                (item.tag && item.tag.toLowerCase().includes(query))
            );

            if (results.length === 0) {
                DOM.searchEmpty.classList.remove('hidden');
                DOM.searchEmpty.innerHTML = `
                    <div class="p-8 text-center text-slate-500">
                        <i class="fas fa-satellite-dish text-2xl md:text-3xl mb-3 opacity-30"></i>
                        <p class="text-[10px] md:text-xs font-mono text-slate-400">No signals match "<span class="text-cyber-400">${query}</span>"</p>
                    </div>`;
            } else {
                DOM.searchEmpty.classList.add('hidden');
                let html = '';
                results.forEach(item => {
                    html += `
                        <a href="${item.url}" target="_blank" onclick="toggleSearch()" class="flex items-center gap-3 p-3 rounded bg-black/40 border border-transparent hover:border-cyber-500/50 hover:bg-cyber-900/20 transition-all group">
                            <div class="w-10 h-10 rounded border border-cyber-500/20 flex items-center justify-center text-slate-500 bg-black group-hover:bg-cyber-500 group-hover:text-black group-hover:border-cyber-400 group-hover:shadow-[0_0_10px_#facc15] transition-all">
                                <i class="${item.icon} text-sm"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-xs md:text-sm font-bold text-slate-200 truncate group-hover:text-cyber-400 drop-shadow-[0_0_2px_rgba(255,255,255,0.2)]">${highlightText(item.nama, query)}</h4>
                                <p class="text-[9px] md:text-[10px] text-slate-500 truncate mono mt-0.5 group-hover:text-slate-300">${item.tag || 'Project'}</p>
                            </div>
                            <i class="fas fa-external-link-alt text-cyber-500/30 group-hover:text-cyber-400 transition-colors text-[10px]"></i>
                        </a>
                    `;
                });
                DOM.searchResults.innerHTML = html;
            }
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="text-black font-bold bg-cyber-400 px-0.5 rounded shadow-[0_0_5px_#facc15]">$1</span>');
        }

        function copyToClipboard(text, successMsg) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast(successMsg));
            } else {
                const ta = document.createElement("textarea");
                ta.value = text; ta.style.position = "fixed"; ta.style.left = "-999999px";
                document.body.appendChild(ta); ta.focus(); ta.select();
                try { document.execCommand('copy'); showToast(successMsg); } 
                catch (err) { showToast('Copy failed'); }
                ta.remove();
            }
        }

        function showToast(message) {
            DOM.toastMsg.textContent = message;
            DOM.toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => DOM.toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function showShareModal() {
            const currentUrl = window.location.href.split('#')[0].split('?')[0]; 
            DOM.shareUrl.value = currentUrl;
            DOM.shareModal.classList.add('active');

            if (!qrCodeInstance) {
                document.getElementById('qrcode-container').innerHTML = '';
                qrCodeInstance = new QRCode(document.getElementById("qrcode-container"), {
                    text: currentUrl, width: 140, height: 140,
                    colorDark : "#000000", colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } else {
                qrCodeInstance.clear();
                qrCodeInstance.makeCode(currentUrl);
            }
        }

        function closeShareModal() { DOM.shareModal.classList.remove('active'); }
        function copyShareUrl() { copyToClipboard(DOM.shareUrl.value, 'Network link copied!'); }

        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== DOM.searchInput && !isSearchOpen) {
                e.preventDefault(); toggleSearch();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault(); toggleSearch();
            }
            if (e.key === 'Escape') {
                if (isSearchOpen) toggleSearch();
                closeShareModal();
            }
        });

        function initParticles() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            let mouse = { x: -1000, y: -1000 };
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive: true});
            window.addEventListener('mouseout', () => { mouse.x = -1000; mouse.y = -1000; });
            window.addEventListener('touchend', () => { mouse.x = -1000; mouse.y = -1000; });

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 2 + 1;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                    
                    // Mouse interaction
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx*dx + dy*dy);
                    if (distance < 100) {
                        this.x -= dx * 0.02;
                        this.y -= dy * 0.02;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = '#facc15';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#f59e0b';
                    ctx.fill();
                    ctx.shadowBlur = 0; // reset
                }
            }

            // Adjust particle count based on screen width for performance
            const particleCount = width > 768 ? 60 : 30;
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                    
                    for (let j = i + 1; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(245, 158, 11, ${1 - dist/120})`;
                            ctx.lineWidth = 1;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        let avatarClickCount = 0;
        let avatarClickTimeout;
        let matrixInterval;

        DOM.avatarTrigger.addEventListener('click', () => {
            avatarClickCount++;
            clearTimeout(avatarClickTimeout);
            
            if (avatarClickCount === 5) {
                triggerEasterEgg();
                avatarClickCount = 0;
            } else {
                avatarClickTimeout = setTimeout(() => { avatarClickCount = 0; }, 1000);
            }
        });

        function triggerEasterEgg() {
            DOM.matrixOverlay.classList.add('active');
            initMatrixRain();
        }

        function closeEasterEgg() {
            DOM.matrixOverlay.classList.remove('active');
            clearInterval(matrixInterval);
        }

        function initMatrixRain() {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=<>?';
            const fontSize = 16;
            const columns = width / fontSize;
            const drops = [];
            
            for(let x = 0; x < columns; x++) drops[x] = 1; 

            // Handle resize during easter egg
            window.addEventListener('resize', () => {
                if(DOM.matrixOverlay.classList.contains('active')){
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                }
            });

            function draw() {
                // Translucent black background to create trail
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, width, height);
                
                ctx.fillStyle = '#facc15'; // Amber/Yellow cyber color
                ctx.font = fontSize + 'px "JetBrains Mono", monospace';
                
                for(let i = 0; i < drops.length; i++) {
                    const text = characters.charAt(Math.floor(Math.random() * characters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    
                    if(drops[i] * fontSize > height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            
            clearInterval(matrixInterval);
            matrixInterval = setInterval(draw, 33); // ~30fps
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
